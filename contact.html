<section class="contacto-section">
    <h1>Formulario de contacto</h1>

    <form class="contacto-form" id="form-contacto" action="contactResponse.html" method="get">
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>

        <div class="form-group">
            <label for="producto">Producto</label>
            <select id="producto" name="producto" required>
                <option value="">Selecciona un producto</option>
                <option value="pay-gojo">Pay Gojo</option>
                <option value="pay-maomao">Pay MaoMao</option>
                <option value="pay-giorno">Pay Golden Experience</option>
                <option value="pay-itadori">Pay Black-Flash</option>
                <option value="pay-purpura">Pay Vacío purpura</option>
                <option value="pay-personalizado">Pay personalizado</option>
            </select>
        </div>

        <div class="form-group">
            <label for="motivo">Motivo</label>
            <textarea id="motivo" name="motivo" rows="8" required></textarea>
        </div>
    </form>

    <button type="submit" form="form-contacto" class="btn-enviar">Enviar</button>
</section>
